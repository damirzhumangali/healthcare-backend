<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Кабинет пациента — HealthAssist</title>
    <style>
      :root {
        --bg: #f7f8fa; --panel: #fff; --line: #e4e7ec;
        --text: #111827; --muted: #6b7280;
        --accent: #0f766e; --accent-soft: #f0fdfb; --accent-hover: #0d645d;
        --danger: #dc2626;
        --success-bg: #f0fdf4; --success-border: #86efac;
        --shadow: 0 2px 12px rgba(0,0,0,.07); --radius: 12px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }

      /* Login */
      #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
      .login-card { background: var(--panel); border-radius: 20px; box-shadow: var(--shadow); padding: 48px 40px; max-width: 400px; width: 100%; text-align: center; }
      .login-icon { width: 64px; height: 64px; background: var(--accent); border-radius: 18px; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; }
      .login-icon svg { width: 34px; height: 34px; fill: #fff; }
      .login-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
      .login-card p { color: var(--muted); font-size: 14px; margin-bottom: 32px; line-height: 1.6; }
      .btn-google { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 13px 20px; border: 2px solid var(--line); border-radius: var(--radius); background: #fff; font-size: 15px; font-weight: 600; color: var(--text); cursor: pointer; transition: border-color .15s, box-shadow .15s; }
      .btn-google:hover { border-color: #4285f4; box-shadow: 0 0 0 3px rgba(66,133,244,.15); }
      .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }
      .auth-error { margin-top: 14px; padding: 10px 14px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; color: var(--danger); font-size: 13px; display: none; }

      /* Shell */
      #app { display: none; }
      header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; color: var(--accent); }
      .brand svg { width: 22px; height: 22px; fill: var(--accent); }
      .hdr-right { display: flex; align-items: center; gap: 10px; }
      .avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid var(--line); }
      .avatar-ph { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
      .uname { font-size: 14px; font-weight: 600; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .btn-sm { padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 13px; cursor: pointer; color: var(--muted); transition: color .15s, border-color .15s; }
      .btn-sm:hover { color: var(--danger); border-color: var(--danger); }

      main { max-width: 800px; margin: 28px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 24px; }

      /* Tabs */
      .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin-bottom: 4px; }
      .tab { padding: 10px 18px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color .15s, border-color .15s; }
      .tab.active { color: var(--accent); border-color: var(--accent); }
      .tab-pane { display: none; }
      .tab-pane.active { display: block; }

      /* Cards */
      .card { background: var(--panel); border-radius: var(--radius); border: 1px solid var(--line); padding: 24px; }
      .card-title { font-size: 15px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
      .card-title svg { width: 18px; height: 18px; fill: var(--accent); flex-shrink: 0; }

      /* Form */
      .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
      .form-row label { font-size: 13px; font-weight: 600; color: var(--muted); }
      .form-row textarea, .form-row input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; color: var(--text); background: #fff; transition: border-color .15s; resize: vertical; }
      .form-row textarea:focus, .form-row input:focus { outline: none; border-color: var(--accent); }
      .form-row textarea { min-height: 80px; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }
      .toggle-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-size: 14px; cursor: pointer; }
      .toggle-row input { width: 17px; height: 17px; accent-color: var(--accent); }
      .btn-primary { display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px; background: var(--accent); color: #fff; border: none; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s; }
      .btn-primary:hover { background: var(--accent-hover); }
      .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
      .form-msg { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; }
      .form-msg.ok { background: var(--success-bg); border: 1px solid var(--success-border); color: #166534; }
      .form-msg.err { background: #fef2f2; border: 1px solid #fecaca; color: var(--danger); }

      /* List items */
      .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
      .section-title { font-size: 15px; font-weight: 700; }
      .badge { background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 20px; }

      .item-card { background: var(--panel); border-radius: var(--radius); border: 1px solid var(--line); padding: 18px; }
      .item-card + .item-card { margin-top: 10px; }
      .item-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
      .item-title { font-size: 15px; font-weight: 600; flex: 1; }
      .status-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
      .s-pending { background: #fef3c7; color: #92400e; }
      .s-active  { background: #dbeafe; color: #1e40af; }
      .s-done    { background: #e5e7eb; color: #374151; }
      .s-new     { background: #fef3c7; color: #92400e; }
      .s-reviewed{ background: #d1fae5; color: #065f46; }
      .item-meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }

      /* Meeting box */
      .meeting-box { background: var(--accent-soft); border: 1.5px solid var(--accent); border-radius: 10px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
      .meeting-info { font-size: 13px; }
      .meeting-info strong { color: var(--accent); font-size: 14px; display: block; margin-top: 2px; }
      .btn-join { display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px; background: var(--accent); color: #fff; border-radius: 8px; font-size: 14px; font-weight: 700; text-decoration: none; transition: background .15s; flex-shrink: 0; }
      .btn-join:hover { background: var(--accent-hover); }
      .btn-join svg { width: 15px; height: 15px; fill: #fff; }

      .empty { padding: 36px; text-align: center; color: var(--muted); font-size: 14px; }
      .spin { display: inline-block; width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>

    <!-- Login -->
    <div id="login-screen">
      <div class="login-card">
        <div class="login-icon">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
        </div>
        <h1>Кабинет пациента</h1>
        <p>Войдите через Google чтобы записаться к врачу и получить ссылку на онлайн-консультацию</p>
        <button class="btn-google" id="btn-login">
          <svg viewBox="0 0 48 48"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.32-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.68 28.18A13.86 13.86 0 0110.8 24c0-1.45.25-2.86.88-4.18v-5.7H4.34A21.98 21.98 0 002 24c0 3.55.85 6.91 2.34 9.88l7.34-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.34 5.7c1.74-5.2 6.59-9.07 12.32-9.07z"/></svg>
          Войти через Google
        </button>
        <div class="auth-error" id="auth-error"></div>
      </div>
    </div>

    <!-- App -->
    <div id="app">
      <header>
        <div class="brand">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20A10 10 0 0012 2zm1 5a1 1 0 00-2 0v4a1 1 0 00.55.89l3 1.5a1 1 0 00.9-1.78L13 10.38V7z"/></svg>
          HealthAssist
        </div>
        <div class="hdr-right">
          <img id="hdr-avatar" class="avatar" style="display:none" alt="" />
          <div id="hdr-avatar-ph" class="avatar-ph" style="display:none"></div>
          <span class="uname" id="hdr-name"></span>
          <button class="btn-sm" id="btn-logout">Выйти</button>
        </div>
      </header>

      <main>
        <div class="tabs">
          <div class="tab active" data-tab="appointments">Мои записи</div>
          <div class="tab" data-tab="consultations">Обращения</div>
          <div class="tab" data-tab="new-consult">Новое обращение</div>
        </div>

        <!-- Мои записи (appointments) -->
        <div class="tab-pane active" id="tab-appointments">
          <div class="section-header">
            <span class="section-title">Записи к врачу</span>
            <span class="badge" id="appt-count">…</span>
          </div>
          <div id="appointments-list"><div class="empty">Загрузка…</div></div>
        </div>

        <!-- Обращения (consultations) -->
        <div class="tab-pane" id="tab-consultations">
          <div class="section-header">
            <span class="section-title">Мои обращения</span>
            <span class="badge" id="consult-count">…</span>
          </div>
          <div id="consultations-list"><div class="empty">Загрузка…</div></div>
        </div>

        <!-- Новое обращение -->
        <div class="tab-pane" id="tab-new-consult">
          <div class="card">
            <div class="card-title">
              <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm-7 3a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H8a1 1 0 110-2h3V7a1 1 0 011-1z"/></svg>
              Описание проблемы
            </div>
            <form id="consult-form" autocomplete="off">
              <div class="form-row">
                <label>Опишите проблему или симптомы *</label>
                <textarea id="f-problem" placeholder="Например: болит горло, температура 38, кашель уже 3 дня…" required></textarea>
              </div>
              <div class="form-grid">
                <div class="form-row">
                  <label>Сколько дней?</label>
                  <input id="f-days" type="number" min="0" max="365" placeholder="3" />
                </div>
                <div class="form-row">
                  <label>Температура</label>
                  <input id="f-temp" type="text" placeholder="37.5 или нет" />
                </div>
              </div>
              <label class="toggle-row">
                <input type="checkbox" id="f-consult" checked />
                Хочу видеоконсультацию с врачом
              </label>
              <button type="submit" class="btn-primary" id="btn-submit">Отправить</button>
              <div class="form-msg" id="form-msg"></div>
            </form>
          </div>
        </div>
      </main>
    </div>

    <script>
      const API = "";

      // ── Utils ─────────────────────────────────────────────────────────────
      function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
      function fmt(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        if (isNaN(d)) return iso;
        return d.toLocaleString("ru-RU", { timeZone:"Asia/Almaty", day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
      }
      function fmtDate(iso) {
        if (!iso) return "";
        const [y,m,d] = iso.split("-");
        return `${d}.${m}.${y}`;
      }

      // ── Auth ─────────────────────────────────────────────────────────────
      async function getMe() {
        try {
          const r = await fetch(`${API}/api/me`, { credentials:"include" });
          if (!r.ok) return null;
          return (await r.json()).user || null;
        } catch { return null; }
      }

      document.getElementById("btn-login").addEventListener("click", async () => {
        try {
          const r = await fetch(`${API}/cabinet/auth/url`);
          const { url } = await r.json();
          location.href = url;
        } catch {
          const el = document.getElementById("auth-error");
          el.textContent = "Не удалось получить ссылку для входа";
          el.style.display = "block";
        }
      });

      document.getElementById("btn-logout").addEventListener("click", async () => {
        await fetch(`${API}/auth/logout`, { method:"POST", credentials:"include" }).catch(()=>{});
        location.reload();
      });

      // ── Tabs ─────────────────────────────────────────────────────────────
      document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
          document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
          tab.classList.add("active");
          document.getElementById("tab-" + tab.dataset.tab).classList.add("active");
        });
      });

      // ── Meeting box helper ───────────────────────────────────────────────
      function meetingBox(url, dateLabel) {
        return `
          <div class="meeting-box">
            <div class="meeting-info">
              🎥 Ссылка на онлайн-консультацию
              <strong>${esc(dateLabel)}</strong>
            </div>
            <a class="btn-join" href="${esc(url)}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11l-4 4z"/></svg>
              Подключиться
            </a>
          </div>`;
      }

      // ── Appointments ─────────────────────────────────────────────────────
      async function loadAppointments() {
        try {
          const r = await fetch(`${API}/api/appointments/my`, { credentials:"include" });
          if (!r.ok) throw new Error();
          const { items } = await r.json();
          renderAppointments(items || []);
        } catch {
          document.getElementById("appointments-list").innerHTML = '<div class="empty">Не удалось загрузить записи</div>';
        }
      }

      const STATUS_LABELS = { pending:"Ожидает", active:"Подтверждена", done:"Завершена" };
      const STATUS_CLASSES = { pending:"s-pending", active:"s-active", done:"s-done" };

      function renderAppointments(items) {
        document.getElementById("appt-count").textContent = items.length;
        const el = document.getElementById("appointments-list");
        if (!items.length) {
          el.innerHTML = '<div class="empty">У вас нет записей к врачу.<br>Запишитесь через главный сайт healthcare.kz/app</div>';
          return;
        }
        el.innerHTML = items.map(a => {
          const doctorName = a.doctor ? esc(a.doctor.name) : "Врач";
          const specialty  = a.doctor ? `<span>${esc(a.doctor.specialty)}</span>` : "";
          const statusLabel = STATUS_LABELS[a.status] || a.status;
          const statusClass = STATUS_CLASSES[a.status] || "s-pending";
          const when = `${fmtDate(a.date)} в ${a.time}`;

          const meeting = a.meeting_url
            ? meetingBox(a.meeting_url, when)
            : "";

          return `
            <div class="item-card">
              <div class="item-head">
                <div class="item-title">👨‍⚕️ ${doctorName}</div>
                <span class="status-badge ${statusClass}">${statusLabel}</span>
              </div>
              <div class="item-meta">
                ${specialty}
                <span>📅 ${when}</span>
                ${a.reason ? `<span>📋 ${esc(a.reason)}</span>` : ""}
              </div>
              ${meeting}
            </div>`;
        }).join("");
      }

      // ── Consultations ─────────────────────────────────────────────────────
      async function loadConsultations() {
        try {
          const r = await fetch(`${API}/api/consultations/my`, { credentials:"include" });
          if (!r.ok) throw new Error();
          const { items } = await r.json();
          renderConsultations(items || []);
        } catch {
          document.getElementById("consultations-list").innerHTML = '<div class="empty">Не удалось загрузить обращения</div>';
        }
      }

      function renderConsultations(items) {
        document.getElementById("consult-count").textContent = items.length;
        const el = document.getElementById("consultations-list");
        if (!items.length) {
          el.innerHTML = '<div class="empty">Нет обращений. Заполните форму во вкладке «Новое обращение».</div>';
          return;
        }
        el.innerHTML = items.map(c => {
          const statusLabel = c.status === "reviewed" ? "Принято" : "На рассмотрении";
          const statusClass = c.status === "reviewed" ? "s-reviewed" : "s-new";
          const meta = [];
          if (c.days) meta.push(`<span>🗓 ${esc(c.days)} дн.</span>`);
          if (c.temperature) meta.push(`<span>🌡 ${esc(c.temperature)}</span>`);
          meta.push(`<span>📅 ${fmt(c.created_at)}</span>`);

          let extra = "";
          if (c.meeting_url && c.meeting_at) {
            extra = meetingBox(c.meeting_url, fmt(c.meeting_at));
          } else if (c.status === "reviewed") {
            extra = `<div class="meeting-box" style="background:#f0fdf4;border-color:#86efac"><div class="meeting-info">Заявка принята — ссылка появится здесь</div></div>`;
          }

          return `
            <div class="item-card">
              <div class="item-head">
                <div class="item-title">${esc(c.problem)}</div>
                <span class="status-badge ${statusClass}">${statusLabel}</span>
              </div>
              <div class="item-meta">${meta.join("")}</div>
              ${extra}
            </div>`;
        }).join("");
      }

      // ── New consultation form ─────────────────────────────────────────────
      document.getElementById("consult-form").addEventListener("submit", async e => {
        e.preventDefault();
        const btn = document.getElementById("btn-submit");
        const msg = document.getElementById("form-msg");
        msg.style.display = "none";

        const problem = document.getElementById("f-problem").value.trim();
        if (problem.length < 5) {
          msg.textContent = "Опишите проблему подробнее"; msg.className = "form-msg err"; msg.style.display = "block"; return;
        }

        btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Отправка…';
        try {
          const r = await fetch(`${API}/api/consultations`, {
            method: "POST", credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              problem,
              days: document.getElementById("f-days").value.trim() || null,
              temperature: document.getElementById("f-temp").value.trim() || null,
              wants_consultation: document.getElementById("f-consult").checked,
            }),
          });
          if (!r.ok) { const d = await r.json().catch(()=>({})); throw new Error(d.error||"error"); }
          msg.textContent = "✅ Заявка отправлена! Врач рассмотрит её в ближайшее время.";
          msg.className = "form-msg ok"; msg.style.display = "block";
          document.getElementById("consult-form").reset();
          document.getElementById("f-consult").checked = true;
          loadConsultations();
          // Switch to consultations tab
          document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
          document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
          document.querySelector('[data-tab="consultations"]').classList.add("active");
          document.getElementById("tab-consultations").classList.add("active");
        } catch(err) {
          msg.textContent = err.message || "Не удалось отправить заявку";
          msg.className = "form-msg err"; msg.style.display = "block";
        } finally {
          btn.disabled = false; btn.innerHTML = "Отправить";
        }
      });

      // ── SSE: real-time update when admin confirms ─────────────────────────
      function connectStream() {
        const es = new EventSource(`${API}/api/consultations/stream`, { withCredentials: true });

        es.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if (data.type === "accepted" && data.consultation) {
              // Reload both lists so the Jitsi link appears immediately
              loadConsultations();
              loadAppointments();
              showNotification("✅ Врач принял вашу заявку! Ссылка на консультацию появилась.");
            }
          } catch {}
        };

        es.onerror = () => {
          es.close();
          // Reconnect after 5 seconds
          setTimeout(connectStream, 5000);
        };
      }

      function showNotification(text) {
        let n = document.getElementById("cabinet-toast");
        if (!n) {
          n = document.createElement("div");
          n.id = "cabinet-toast";
          n.style.cssText = "position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f766e;color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:100;transition:opacity .4s;";
          document.body.appendChild(n);
        }
        n.textContent = text;
        n.style.opacity = "1";
        clearTimeout(n._timer);
        n._timer = setTimeout(() => { n.style.opacity = "0"; }, 5000);
      }

      // ── Init ─────────────────────────────────────────────────────────────
      (async () => {
        const params = new URLSearchParams(location.search);
        const authErr = params.get("auth_error");
        if (authErr) {
          document.getElementById("auth-error").textContent = "Ошибка входа: " + decodeURIComponent(authErr);
          document.getElementById("auth-error").style.display = "block";
        }

        const user = await getMe();
        if (!user) return;

        document.getElementById("login-screen").style.display = "none";
        document.getElementById("app").style.display = "block";
        document.getElementById("hdr-name").textContent = user.name || user.email || "";
        if (user.picture) {
          const img = document.getElementById("hdr-avatar"); img.src = user.picture; img.style.display = "block";
        } else {
          const ph = document.getElementById("hdr-avatar-ph"); ph.textContent = (user.name||user.email||"П")[0].toUpperCase(); ph.style.display = "flex";
        }

        loadAppointments();
        loadConsultations();
        connectStream();
      })();
    </script>
  </body>
</html>
